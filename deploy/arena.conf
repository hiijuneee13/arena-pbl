# Halaman awal diarahkan ke frontend
RedirectMatch ^/$ /frontend/index.html

# Folder internal tidak boleh dibuka dari browser
<DirectoryMatch "^/var/www/html/(database|docs|deploy)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html/backend/config>
    Require all denied
</Directory>

ServerTokens Prod
ServerSignature Off
