ServerName localhost

# Hosting memakai HTTPS di depan container; teruskan ke PHP supaya link PDF dan QR memakai https
SetEnvIf X-Forwarded-Proto https HTTPS=on

# Folder internal tidak boleh dibuka dari browser
<DirectoryMatch "^/var/www/html/(database|docs|deploy)(/|$)">
    Require all denied
</DirectoryMatch>
<Directory /var/www/html/backend/config>
    Require all denied
</Directory>

ServerTokens Prod
ServerSignature Off
