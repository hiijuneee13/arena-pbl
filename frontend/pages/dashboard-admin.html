<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin TU - ARENA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages/main.css">
  <link rel="stylesheet" href="../assets/css/pages/dasboard-admin.css">
</head>
<body>
  <div id="app">

    <!-- Menu: Dashboard (GET dashboard_admin.php) -->
    <section class="view" data-view="dashboard">
      <div class="grid cols-4" id="stat-dash"></div>

      <div class="grid split">
        <div class="card">
          <div class="card-title">Managemen Ruang</div>
          <div class="toolbar">
            <div class="filters" data-filter-slot></div>
            <div class="spacer"></div>
            <button type="button" class="btn btn-outline btn-rect" data-goto="gedung">Selengkapnya &gt;</button>
          </div>
          <div class="table-wrap"><table class="rtable" id="tbl-ruang-dash"></table></div>
        </div>
        <div class="card"><div class="card-title">Log Aktivitas</div><div id="log"></div></div>
      </div>

      <h2 class="section-title">Siap Dikunci &amp; Diterbitkan Surat Izin</h2>
      <div class="card"><div id="siap-terbit"></div></div>

      <h2 class="section-title">Laporan Rekapitulasi</h2>
      <div class="grid cols-2 rekap" id="stat-rekap"></div>
    </section>

    <!-- Halaman "Selengkapnya": Managemen Ruang penuh (GET get_gedung.php, POST update_status_gedung.php) -->
    <section class="view" data-view="gedung">
      <div class="card card-tall">
        <div class="card-title">Managemen Ruang</div>
        <div class="toolbar"><div class="filters" data-filter-slot></div></div>
        <div class="table-wrap"><table class="rtable" id="tbl-ruang-full"></table></div>
      </div>
    </section>

    <!-- Menu: Pengajuan (reservasi Approved dari get_jadwal_global.php, siap diterbitkan suratnya) -->
    <section class="view" data-view="pengajuan">
      <div class="card card-tall">
        <div class="card-title">Gedung</div>
        <div class="table-wrap"><table class="rtable" id="tbl-pengajuan"></table></div>
      </div>
    </section>

    <!-- Modal: surat izin digital + QR -->
    <div class="overlay" id="m-surat"><div class="modal wide">
      <h2>Surat Izin Digital</h2>
      <div class="surat-body">
        <div>
          <dl class="kv" id="surat-info"></dl>
          <div class="note-box" id="surat-note"></div>
        </div>
        <div class="qr-box" id="surat-qr"></div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="UI.modal.close('m-surat')">Tutup</button>
        <button class="btn" id="btn-terbit">Terbitkan Surat</button>
      </div>
    </div></div>

    <!-- Modal: konfirmasi ubah status ruang -->
    <div class="overlay" id="m-gedung"><div class="modal narrow">
      <h2 id="gd-title">Ubah Status Ruang</h2>
      <div class="note-box" id="gd-note"></div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="UI.modal.close('m-gedung')">Batal</button>
        <button class="btn" id="btn-gd-ok">Ya, Ubah</button>
      </div>
    </div></div>
  </div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/shell.js"></script>
  <script src="../assets/js/dasboard-admin.js"></script>
</body>
</html>
